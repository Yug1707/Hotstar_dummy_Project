<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotstar Scale Lab</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1b1b1b; --muted: #666; --card: #fff; --line: #e3e3e0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141414; --fg: #eee; --muted: #9a9a9a; --card: #1e1e1e; --line: #333; } }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 16px; }
    code { font-size: 14px; } .muted { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Hotstar Scale Lab</h1>
  <p>A scaled-down replica of cricket-streaming traffic spikes on AWS. The full dashboard arrives in Phase 6.</p>
  <div class="card">
    <strong>Served by</strong>
    <p id="who" class="muted">loading…</p>
  </div>
</main>
<script>
  async function tick() {
    try {
      const r = await fetch("/api/v1/whoami", { cache: "no-store" });
      const j = await r.json();
      document.getElementById("who").textContent =
        `${j.instance_id} · ${j.az} · up ${j.uptime_s}s · degrade level ${j.degrade_level} · ${j.version}`;
    } catch (e) { document.getElementById("who").textContent = "API unreachable"; }
  }
  tick(); setInterval(() => { if (!document.hidden) tick(); }, 2000);
</script>
</body>
</html>
