name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements-dev.txt
            analysis/requirements.txt
      - run: pip install -r app/requirements-dev.txt -r analysis/requirements.txt
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: pytest
        run: pytest -q -m "not slow"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: no secrets in web/
        run: "! grep -rniE 'x-load-test|loadtest_token' web/"
      - name: results.json is valid and index.html references only files that exist
        run: |
          python3 -m json.tool web/data/results.json >/dev/null
          for f in $(grep -oE '(src|href)="(js|img|data)/[^"]+"' web/index.html | cut -d'"' -f2); do
            test -f "web/$f" || { echo "missing web/$f"; exit 1; }
          done
          for f in web/js/*.js; do node --check "$f"; done
      - name: analysis pipeline runs end to end on synthetic data
        run: |
          pip install -q -r analysis/requirements.txt
          python analysis/fake_campaign.py --out "$RUNNER_TEMP/res" --runs 1
          python analysis/parse_k6.py --all --pattern 'FAKE_*' --results "$RUNNER_TEMP/res"
          python analysis/make_plots.py --results "$RUNNER_TEMP/res" --prefix FAKE_ --out "$RUNNER_TEMP/fig"

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh infra/*.sh

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: terraform test (mock providers, no AWS)
        run: terraform test

  packer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-packer@v3
        with:
          version: "1.16.2"
      - run: packer fmt -check -diff infra/streamlite.pkr.hcl
      - run: packer init infra/streamlite.pkr.hcl
      - run: packer validate -syntax-only infra/streamlite.pkr.hcl

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -f app/Dockerfile --build-arg GIT_SHA=${GITHUB_SHA::7} -t streamlite:ci .
      - name: container starts and /healthz returns 200 within 5 s
        run: |
          docker run -d --name s -p 8000:8000 -e IMDS_ENABLED=false -e SSM_MODE=off streamlite:ci
          for i in $(seq 1 50); do
            if curl -sf localhost:8000/healthz; then echo; echo "healthy after ~$((i*100)) ms"; exit 0; fi
            sleep 0.1
          done
          docker logs s; exit 1
      - name: no secrets in web/
        run: "! grep -rniE 'x-load-test|loadtest_token' web/"
